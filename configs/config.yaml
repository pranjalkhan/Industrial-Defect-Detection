# ============================================================
# Industrial Defect Detection System - Configuration
# ============================================================

project:
  name: "industrial-defect-detection"
  version: "1.0.0"

data:
  dataset_root: "data/mvtec_anomaly_detection"
  category: "bottle"
  image_size: 256
  val_split: 0.15
  random_seed: 42

training:
  autoencoder:
    epochs: 50
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0
    scheduler: "cosine"  # cosine, step, none
    save_every: 10

  resnet_features:
    backbone: "resnet18"
    layers: ["layer2", "layer3"]
    
  patchcore:
    backbone: "wide_resnet50_2"
    layers: ["layer2", "layer3"]
    coreset_sampling_ratio: 0.1
    num_neighbors: 9

detection:
  # Threshold calibration
  threshold_percentile: 99.0
  # Top-k% pixels for anomaly score
  score_top_k_percent: 1.0

evaluation:
  metrics:
    - image_auroc
    - pixel_auroc
    - image_f1
    - pixel_f1
    - precision
    - recall

mlflow:
  experiment_name: "industrial-defect-detection"
  tracking_uri: "sqlite:///mlflow.db"

api:
  host: "0.0.0.0"
  port: 8000
  max_upload_size_mb: 10
  allowed_extensions: ["png", "jpg", "jpeg"]

dashboard:
  port: 8501
